# apiplant demo app configuration. Every key here is optional; delete the file
# entirely and the framework still boots with safe defaults.

[server]
host = "127.0.0.1"
port = 8099
base_path = "/api"          # the API is mounted under /api

[database]
url = "postgres://postgres@127.0.0.1:55432/apiplant_domains"
auto_migrate = true

[auth]
jwt_secret = "demo-secret-change-me-in-production"
allow_registration = true   # the whole example hangs off /auth/register

[docs]
enabled = true
path = "/docs"
title = "14 · Email domains"
