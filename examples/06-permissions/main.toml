[app]
name = "06 · Permissions"

[server]
port = 8099
base_path = "/api"

[database]
url = "postgres://postgres@127.0.0.1:5432/apiplant_permissions"
auto_migrate = true

[auth]
jwt_secret = "example-secret-change-me"

[docs]
enabled = true
path = "/docs"
title = "06 · Permissions"

# Who administers the deployment itself.
#
# The class decides what a `@org_class=` permission lets people do, so an
# organisation that could set its own class could grant itself access. The
# column is therefore server-owned — stripped from every request body — except
# for the callers named here, in the same grammar `[permissions]` uses.
#
# They are the back office, and it is one grant rather than five: they class any
# organisation, list every organisation and every user, and read and write data
# in all of them, because role checks and organisation checks do not apply to
# them. `private` still does. Unset, this is `private` for everybody: nobody
# administers anything, and classes come only from seed data.
[organization]
global_admin_role = "role:admin@org_class=admin"

# What a new organisation starts as. Every tenant here is a customer until the
# back office says otherwise, so a permission written for `org_class=customer`
# applies to an organisation from the moment somebody creates one — including
# the personal organisation every account is given at registration.
default_org_class = "customer"
