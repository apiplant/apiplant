# The organisation every example starts in.
#
# `id = "acme"` is an alias, not a UUID: seeding hashes it into a stable id, so
# every file that writes `organization_id = "acme"` means this row, and running
# the seed twice inserts it once.

[[row]]
id = "acme"
name = "Acme, Inc."
slug = "acme"

[[row]]
id = "globex"
name = "Globex Corporation"
slug = "globex"
