# Fetching something bought outright.
#
# The counterpart to `document`: that one is gated on a *subscription* and this
# one on a *purchase*, and the difference is the whole reason both exist. A
# subscription is a thing that can lapse, so its check asks about right now. A
# purchase is a thing that happened, so its check asks about the past — and a
# row here is the record of somebody exercising it.
#
# As with `document`, there is nothing billing-specific in this file. It is an
# ordinary org-scoped resource; the paywall is the `before_create` hook.

[resource]
name = "download"
scope = "organization"
timestamps = true

[admin]
label = "Download"
plural = "Downloads"

[permissions]
list   = "member"
read   = "member"
create = "member"          # …if the organisation has bought it: see the hook
update = "private"         # a download is a record of an event, not a draft
delete = "role:admin"

[hooks]
before_create = "require_purchase"

# Which product is being fetched — matched against `billing_product.name` by
# the hook. A name rather than a price id on purpose: raising a price mints a
# new Stripe price and archives the old one, and somebody who bought at last
# year's price still owns the thing.
[fields.product]
type     = "string"
required = true

# Where it was sent, for support and for the audit trail. Filled in by the app
# in a real deployment; here it is just a column that shows the row is a record
# of something that happened.
[fields.delivered_to]
type = "string"
max_length = 320
