# apiplant demo app configuration. Every key here is optional; delete the file
# entirely and the framework still boots with safe defaults.

[app]
name = "18 · Payments"

[server]
port = 8101
base_path = "/api"          # the API is mounted under /api

# The origin Stripe sends a buyer back to when neither the call nor the section
# below names a URL. Locally this is the address you actually open; behind a
# proxy it is what the browser sees, not what the process is bound to.
public_url = "http://localhost:8101"

[database]
url = "${DATABASE_URL:-postgres://postgres@127.0.0.1:5432/apiplant_payments}"
auto_migrate = true

[auth]
jwt_secret = "demo-secret-change-me-in-production"
allow_registration = true

[docs]
enabled = true
path = "/docs"
title = "18 · Payments"

# ---------------------------------------------------------------------------
# Taking money.
#
# Naming a provider here does three things at once: it connects a Stripe
# client, it adds the five `billing_*` resources — catalogue, customers,
# subscriptions, payments — with their permissions already set, and it mounts
# the four `/billing` endpoints. Delete this section and all of it goes away,
# including the tables.
#
# Every value is a credential, so the file names the variable rather than the
# value. `stripe listen` prints the webhook secret; the two keys are in the
# Stripe dashboard under Developers → API keys. Test keys (`sk_test_…`) are
# what you want here — the card 4242 4242 4242 4242 pays with them.
# ---------------------------------------------------------------------------
[payments]
provider        = "stripe"
secret_key      = "${STRIPE_SECRET_KEY}"
publishable_key = "${STRIPE_PUBLISHABLE_KEY:-}"
webhook_secret  = "${STRIPE_WEBHOOK_SECRET:-}"

# Prices in this app that don't name a currency are in euros.
currency = "eur"

# Hand the tax question to Stripe Tax: it works out what the buyer owes from
# where they are and what you have registered for, and adds it to the charge.
# With no registrations configured in the Stripe dashboard it computes nothing
# and the buyer pays the price — it is not a substitute for registering.
automatic_tax = true

# Ask business buyers for a VAT/GST number. This is what makes the reverse
# charge apply, which is the difference between charging a German company 19%
# and charging them nothing.
tax_id_collection = true

# Where a buyer lands afterwards. Left empty here so the example uses the
# dashboard's own billing screen, which is a real page with a real result on
# it — a production app points these at its own.
# success_url = "https://example.com/thanks"
# cancel_url  = "https://example.com/pricing"
