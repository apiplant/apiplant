# A blog post. Organisation-scoped by default (multitenant): the framework adds
# an `organization_id`, isolates every query to the caller's active organisation,
# and stamps it on create. The permissions below decide who *within* the org:
#   list/read/create — any member
#   update           — only the post's owner
#   delete           — only an `admin` of that organisation
#
# Publishes:
#   GET/POST /api/post, GET/PATCH/DELETE /api/post/{id}
#   GET /api/organization/{id}/post   (a has_many, from the auto organization_id)

[resource]
name = "post"

[permissions]
list   = "member"
read   = "member"
create = "member"
update = "owner"
delete = "role:admin"

[fields.title]
type = "string"
required = true
max_length = 200

[fields.body]
type = "text"

[fields.published]
type = "boolean"
default = false

[fields.owner_id]
type = "reference"
references = "user"

# Lifecycle hooks: run a function around each operation. Uncomment after
# building the example and dropping it in — a hook whose function isn't loaded
# fails its requests closed with a 500, on purpose.
#
#   cargo build -p function-post-hooks
#   cp target/debug/libfunction_post_hooks.so examples/demo-app/functions/
#
# [hooks]
# before_create = "post_hooks"   # validate & normalise the title
# before_update = "post_hooks"
# after_create  = "post_hooks"   # log who created the post
# after_list    = "post_hooks"   # envelope the list, hide drafts from anonymous callers
