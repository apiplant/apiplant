<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · 22 · OAuth</title>
<!--
  The sign-in page: one ordinary file in `public/`, served at `/` by the same
  process that serves the API.

  The buttons are **links**. `/api/auth/oauth/github/start` answers with a
  redirect to GitHub, and GitHub redirects back into the API, which finishes the
  handshake and sends the browser here with the token in the URL fragment. So
  the only code below is the six lines that read that fragment — everything
  else is presentation, and a page of four `<a>` tags with no script at all
  would still sign somebody in.
-->
<style>
  :root { color-scheme: light dark; --line: color-mix(in oklab, currentColor 15%, transparent); }
  body { font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         margin: 0; display: grid; place-items: center; min-height: 100dvh; padding: 2rem; }
  main { width: min(30rem, 100%); }
  h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
  p.lede { margin: 0 0 1.75rem; opacity: .7; }
  a.button, button { font: inherit; display: flex; gap: .7rem; align-items: center; width: 100%;
    padding: .7rem 1rem; margin-bottom: .6rem; border: 1px solid var(--line);
    border-radius: .6rem; background: transparent; color: inherit; cursor: pointer;
    text-align: left; text-decoration: none; box-sizing: border-box; }
  a.button:hover, button:hover { background: color-mix(in oklab, currentColor 8%, transparent); }
  .why { margin-left: auto; font-size: .8rem; opacity: .7; }
  svg, .mark, img.icon, button img, a img { width: 1.15rem; height: 1.15rem; flex: none;
    border-radius: 3px; object-fit: contain; }
  .initial { display: grid; place-items: center; font-size: .7rem; font-weight: 600;
             background: color-mix(in oklab, currentColor 12%, transparent); }
  .card { border: 1px solid var(--line); border-radius: .8rem; padding: 1.1rem; margin-bottom: 1rem; }
  .row { display: flex; gap: .9rem; align-items: center; }
  img.avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; }
  pre { overflow-x: auto; border: 1px solid var(--line); border-radius: .6rem; padding: .75rem;
        background: color-mix(in oklab, currentColor 5%, transparent); }
  .muted { opacity: .65; font-size: .85rem; }
  .error { border: 1px solid #c33; border-radius: .6rem; padding: .7rem .9rem; margin-bottom: 1rem; }
</style>
</head>
<body>
<main>
  <h1>22 · OAuth</h1>
  <p class="lede">Sign in with an account you already have.</p>
  <div id="error" class="error" hidden></div>
  <div id="view"></div>
</main>

<script type="module">
const API = "/api";
const view = document.getElementById("view");

// The provider marks, from Super Tiny Icons (https://github.com/edent/
// SuperTinyIcons, MIT): a few hundred bytes each, inline because a sign-in page
// should not have to ask a CDN who is signing in. GitHub's mark is the black
// one it publishes; the white variant is what a dark page would use.
const MARKS = {
  github: `<svg viewBox="0 0 512 512" aria-hidden="true"><path d="m0 0H512V512H0" fill="#181717"/><path fill="#fff" d="M335 499c-13 0-16-6-16-12l1-70c0-24-8-40-18-48 57-6 117-28 117-126 0-28-10-51-26-69 3-6 11-32-3-67 0 0-21-7-70 26-42-12-86-12-128 0-49-33-70-26-70-26-14 35-6 61-3 67-16 18-26 41-26 69 0 98 59 120 116 126-7 7-14 18-16 35-15 6-52 17-74-22 0 0-14-24-40-26 0 0-25 0-1 16 0 0 16 7 28 37 0 0 15 50 86 34l1 44c0 6-3 12-16 12-14 0-12 17-12 17H347s2-17-12-17Z"/></svg>`,
  google: `<svg viewBox="0 0 512 512" aria-hidden="true"><path d="m0 0H512V512H0" fill="#fff"/><path fill="#34a853" d="M153 292c30 82 118 95 171 60h62v48A192 192 0 0190 341"/><path fill="#4285f4" d="m386 400a140 175 0 0053-179H260v74h102q-7 37-38 57"/><path fill="#fbbc02" d="m90 341a208 200 0 010-171l63 49q-12 37 0 73"/><path fill="#ea4335" d="m153 219c22-69 116-109 179-50l55-54c-78-75-230-72-297 55"/></svg>`,
  linkedin: `<svg viewBox="0 0 512 512" aria-hidden="true" fill="#fff"><path d="m0 0H512V512H0" fill="#0077b5"/><circle cx="142" cy="138" r="37"/><path stroke="#fff" stroke-width="66" d="M244 194v198M142 194v198"/><path d="M276 282c0-20 13-40 36-40 24 0 33 18 33 45v105h66V279c0-61-32-89-76-89-34 0-51 19-59 32"/></svg>`,
  x: `<svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" fill="#fff"/><path d="M321.8 373.1h36.6L190 137.5H153.4ZM391 389.9H310.6L237 285.1 144.8 389.9H121L226.4 270 121 120h80.4l69.7 99.2L358.4 120h23.8L281.7 234.3Z"/></svg>`,
};

/**
 * A provider's mark: one of the four above, then whatever `[oauth.<name>] icon`
 * pointed at, then the provider's initial. The endpoint hands the icon over, so
 * adding a provider with a logo is still only a config change.
 */
const mark = (provider, label, icon) =>
  MARKS[provider] ??
  (icon ? `<img src="${icon}" alt="">`
        : `<span class="mark initial">${(label[0] ?? "?").toUpperCase()}</span>`);
const errorBox = document.getElementById("error");

// The token arrives in the fragment — `/#token=…` — because `token_delivery`
// is `fragment`. A fragment is never sent to a server, so it stays out of
// access logs and out of the `Referer` header on the next click. Reading it and
// clearing it is the entire client side of this handshake.
const arriving = new URLSearchParams(location.hash.slice(1)).get("token");
if (arriving) {
  localStorage.setItem("token", arriving);
  history.replaceState(null, "", location.pathname);
}
const token = () => localStorage.getItem("token");

async function call(path, options = {}) {
  const headers = { "content-type": "application/json" };
  if (options.auth && token()) headers.authorization = `Bearer ${token()}`;
  const response = await fetch(API + path, { ...options, headers });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload.error ?? response.statusText);
  return payload;
}

async function signedOut() {
  // Which buttons to draw is a question for the server: `[oauth]` decides, and
  // this endpoint reports. Adding a fifth provider is then a config change and
  // no edit here at all.
  const { providers } = await call("/auth/oauth");
  view.replaceChildren();

  if (providers.length === 0) {
    view.innerHTML = `<p class="muted">No providers are configured. Set
      <code>GITHUB_CLIENT_ID</code> and <code>GITHUB_CLIENT_SECRET</code> and restart —
      see the README.</p>`;
  }
  for (const provider of providers) {
    const link = document.createElement("a");
    link.className = "button";
    // A link, not a fetch. The endpoint answers 302, so the browser simply goes.
    link.href = `${provider.start_url}?return_to=/`;
    link.innerHTML = `${mark(provider.provider, provider.label, provider.icon)}<span>Continue with <strong>${provider.label}</strong></span>`;
    if (!provider.provides_email) {
      link.insertAdjacentHTML("beforeend", `<span class="why">no email address</span>`);
    }
    view.append(link);
  }

  view.insertAdjacentHTML("beforeend", `<p class="muted">Password sign-in still works:
    <code>POST /api/auth/login</code> with <code>admin@example.com</code> / <code>password</code>.</p>`);
}

async function signedIn() {
  // `/auth/me` is the framework's own endpoint and it knows nothing about
  // OAuth — it accepts this token because it is the same token `POST
  // /auth/login` issues.
  const me = await call("/auth/me", { auth: true });
  const user = await call(`/user/${me.user_id}`, { auth: true }).catch(() => ({}));
  // `oauth_connection` is `owner`-scoped, so this is the caller's own and
  // nobody else's, with no filter in the request saying so.
  const connections = await call("/oauth_connection", { auth: true });
  const { providers } = await call("/auth/oauth");

  view.replaceChildren();
  view.insertAdjacentHTML("beforeend", `
    <div class="card"><div class="row">
      ${user.avatar_url ? `<img class="avatar" src="${user.avatar_url}" alt="">` : ""}
      <div><strong>${user.display_name ?? user.email ?? me.user_id}</strong><br>
        <span class="muted">${user.email ?? ""}${user.email_placeholder ? " · placeholder" : ""}</span>
      </div>
    </div></div>
    <p><strong>Linked accounts</strong></p>`);

  for (const connection of connections) {
    const row = document.createElement("button");
    row.innerHTML = `${mark(connection.provider, connection.provider)}
                     <span>${connection.display_name ?? connection.provider_user_id}</span>
                     <span class="why">unlink</span>`;
    row.addEventListener("click", async () => {
      try {
        await call(`/auth/oauth/${connection.provider}`, { method: "DELETE", auth: true });
        render();
      } catch (error) { fail(error.message); }
    });
    view.append(row);
  }

  // Connecting another provider is the same start endpoint with a session on
  // it — which is why this one is a POST rather than a link: a browser cannot
  // put an `Authorization` header on a navigation.
  const linked = new Set(connections.map((c) => c.provider));
  for (const provider of providers.filter((p) => !linked.has(p.provider))) {
    const button = document.createElement("button");
    button.innerHTML = `${mark(provider.provider, provider.label, provider.icon)}<span>Connect ${provider.label}</span>`;
    button.addEventListener("click", async () => {
      try {
        const { authorize_url } = await call(`/auth/oauth/${provider.provider}/start`, {
          method: "POST",
          auth: true,
          body: JSON.stringify({}),
        });
        location.assign(authorize_url);
      } catch (error) { fail(error.message); }
    });
    view.append(button);
  }

  const out = document.createElement("button");
  out.textContent = "Sign out";
  out.addEventListener("click", () => { localStorage.removeItem("token"); render(); });
  view.append(out);

  view.insertAdjacentHTML("beforeend", `<details><summary class="muted">The session token</summary>
    <pre>${token()}</pre><p class="muted">An ordinary HS256 JWT with <code>sub</code> and
    <code>exp</code> — the same thing <code>POST /api/auth/login</code> returns.</p></details>`);
}

function fail(message) {
  errorBox.textContent = message;
  errorBox.hidden = false;
}

async function render() {
  errorBox.hidden = true;
  try {
    await (token() ? signedIn() : signedOut());
  } catch (error) {
    // A token that no longer verifies belongs on the sign-in page, not on an
    // error nobody can act on.
    if (token()) { localStorage.removeItem("token"); return render(); }
    fail(error.message);
  }
}

render();
</script>
</body>
</html>
