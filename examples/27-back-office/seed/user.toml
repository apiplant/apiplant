# Everybody's password is `password`. It is not a field of the resource — it is
# hashed, with argon2, into whichever field the `user` resource's `[auth]`
# section names — so the plaintext never reaches the database and the fixture
# stays readable.
#
# Nine accounts, and none of them is special by itself. What each one may do is
# decided entirely by `seed/membership.toml`: sign in as any of them to see the
# same endpoints answer differently.

