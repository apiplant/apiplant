<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>apiplant admin</title>
    <meta
      name="description"
      content="A static operator console for apiplant applications — sign in, manage organizations, work with resources, and trigger approved actions."
    />
    <meta name="theme-color" content="#171a21" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f5fa" media="(prefers-color-scheme: light)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2327282f'/%3E%3Ctext x='2' y='23.5' font-family='Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='%23ffffff'%3EA%3C/text%3E%3Ctext x='15' y='23.5' font-family='Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='%234b9dff'%3EP%3C/text%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("apiplant-admin-theme");
          var light = stored === "light" || (!stored && window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) document.documentElement.classList.add("light");
          document.documentElement.style.colorScheme = light ? "light" : "dark";
        } catch (_) {}
      })();
    </script>
    <script type="module" crossorigin src="./app.js"></script>
    <link rel="stylesheet" crossorigin href="./app.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
