# Nothing here is C-specific. A function's language is invisible to the rest of
# the app: it gets mounted, authenticated and documented the same either way.

[app]
name = "10 · Functions in Zig"

[server]
host = "127.0.0.1"
port = 8099
base_path = "/api"

[database]
url = "postgres://postgres@127.0.0.1:55432/apiplant_zig_functions"
auto_migrate = true

[auth]
jwt_secret = "demo-secret-change-me-in-production"
allow_registration = true

[docs]
enabled = true
path = "/docs"
title = "10 · Functions in Zig"
