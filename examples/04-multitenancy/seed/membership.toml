# Who belongs where, and as what. `role = "admin"` is what makes the seeded
# account an administrator of Acme — a `role:admin` permission is checked
# against these rows.
#
# Seeding writes rows directly, so the `before_create` hook that lets the API
# name a member by email does not run here: say `user_id` outright.

[[row]]
id = "admin-at-acme"
user_id = "admin"
organization_id = "acme"
role = "admin"

[[row]]
id = "editor-at-acme"
user_id = "editor"
organization_id = "acme"
role = "editor"

[[row]]
id = "member-at-acme"
user_id = "member"
organization_id = "acme"
role = "member"

[[row]]
id = "admin-at-globex"
user_id = "admin"
organization_id = "globex"
role = "admin"

# …and an admin of Operations, the `org_class = "admin"` organisation. That
# membership is what `[organization] global_admin_role = "role:admin@org_class=admin"`
# in main.toml names, so signing in as this account is what makes somebody the
# deployment's administrator — wherever they happen to be standing.

[[row]]
id = "admin-at-operations"
user_id = "admin"
organization_id = "operations"
role = "admin"
