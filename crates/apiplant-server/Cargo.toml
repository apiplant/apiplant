[package]
name = "apiplant-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "apiplant HTTP server: CRUD routing, function endpoints and TLS on ntex"

[features]
default = ["typescript"]
# TypeScript functions. On, the server embeds V8 (via `apiplant-js`) and can
# load the `.js` that `apiplant build` produces from a `.ts`. Off — the "slim"
# build — it serves compiled functions only and V8 is not linked at all, which
# is most of the binary. A `.js` in `functions/` is still recognised and
# reported, rather than silently ignored: an app that is quietly missing half
# its endpoints is worse than one that says why.
typescript = ["dep:apiplant-js"]

[dependencies]
apiplant-core.workspace = true
apiplant-db.workspace = true
apiplant-auth.workspace = true
apiplant-email.workspace = true
liquid.workspace = true
apiplant-payments.workspace = true
apiplant-oauth.workspace = true
apiplant-ai.workspace = true
futures-util.workspace = true
apiplant-cache.workspace = true
apiplant-storage.workspace = true
apiplant-queue.workspace = true
apiplant-abi = { workspace = true, features = ["manifest-json"] }
apiplant-assets.workspace = true
apiplant-js = { workspace = true, optional = true }
abi_stable.workspace = true
libloading.workspace = true
ntex.workspace = true
ntex-ratelimiter.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
toml.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
otlp-http-client.workspace = true
opentelemetry-semantic-conventions.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
