[workspace]
resolver = "2"
members = [
    "crates/apiplant-abi",
    "crates/apiplant-assets",
    "crates/apiplant-function",
    "crates/apiplant-core",
    "crates/apiplant-db",
    "crates/apiplant-auth",
    "crates/apiplant-email",
    "crates/apiplant-cache",
    "crates/apiplant-js",
    "crates/apiplant-server",
    "crates/apiplant",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["apiplant contributors"]
repository = "https://github.com/apiplant/apiplant"

[workspace.dependencies]
# Internal crates
apiplant-abi = { path = "crates/apiplant-abi" }
apiplant-assets = { path = "crates/apiplant-assets" }
apiplant-function = { path = "crates/apiplant-function" }
apiplant-core = { path = "crates/apiplant-core" }
apiplant-db = { path = "crates/apiplant-db" }
apiplant-auth = { path = "crates/apiplant-auth" }
apiplant-email = { path = "crates/apiplant-email" }
apiplant-cache = { path = "crates/apiplant-cache" }
apiplant-js = { path = "crates/apiplant-js" }
apiplant-server = { path = "crates/apiplant-server" }

# Stable ABI for dynamically loaded functions
abi_stable = "0.11"

# Async runtime + web server
# `full` is not our choice to trim: deno_core enables it, and cargo unifies
# features across the graph, so narrowing this list changes nothing.
tokio = { version = "1", features = ["full"] }
ntex = { version = "2", features = ["tokio", "rustls"] }

# Database (sea-query for dynamic schema/queries, sea-orm for the pool + executor)
sea-orm = { version = "1.1", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "with-uuid",
    "with-chrono",
    "with-json",
    "macros",
] }
sea-query = { version = "0.32", features = ["backend-postgres", "with-uuid", "with-chrono", "with-json"] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
toml = "0.8"

# Auth
argon2 = "0.5"
jsonwebtoken = "9"

# Outbound email (HTTP APIs + SMTP) — rustls everywhere, no OpenSSL
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "charset",
    "http2",
] }
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
    "ring",
    "webpki-roots",
] }

# AWS SigV4 request signing (SES)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Cache
redis = { version = "0.27", default-features = false, features = [
    "tokio-rustls-comp",
    "connection-manager",
] }

# TLS
rustls = "0.23"
rustls-pemfile = "2"

# Terminal user interface (the `apiplant cli` console)
ratatui = "0.29"
crossterm = "0.28"

# Utilities
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
libloading = "0.8"

# TypeScript/JavaScript functions: V8 isolates at runtime, oxc to strip types at build time
deno_core = "0.409"
deno_error = "0.7"
oxc_allocator = "0.141"
oxc_ast = "0.141"
oxc_codegen = "0.141"
oxc_parser = "0.141"
oxc_semantic = "0.141"
oxc_span = "0.141"
oxc_transformer = "0.141"
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
# Cross-crate inlining across the whole graph, in one codegen unit so LLVM sees
# everything at once. Slow to build, but this is the profile we ship.
lto = "fat"
codegen-units = 1
# Debug symbols are ~20MB of a binary nobody debugs from a release build.
strip = "symbols"
incremental = false
panic = "unwind"

# Functions are loaded as cdylibs over a C ABI, so they must be built with the
# same settings — a `panic = "abort"` here would abort on a unwind that crosses
# back from V8 or from a plugin.

[profile.release.package."*"]
opt-level = 3
codegen-units = 1
