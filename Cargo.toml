[workspace]
resolver = "2"
members = [
    "crates/apiplant-abi",
    "crates/apiplant-assets",
    "crates/apiplant-function",
    "crates/apiplant-core",
    "crates/apiplant-db",
    "crates/apiplant-auth",
    "crates/apiplant-email",
    "crates/apiplant-cache",
    "crates/apiplant-storage",
    "crates/apiplant-queue",
    "crates/apiplant-payments",
    "crates/apiplant-oauth",
    "crates/apiplant-ai",
    "crates/apiplant-js",
    "crates/apiplant-server",
    "crates/apiplant",
]

[workspace.package]
version = "0.8.1"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Federico Rampazzo <federico@apiplant.com>"]
repository = "https://github.com/apiplant/apiplant"

[workspace.dependencies]
# Internal crates
apiplant-abi = { path = "crates/apiplant-abi", version = "0.8.1" }
apiplant-assets = { path = "crates/apiplant-assets", version = "0.8.1" }
apiplant-function = { path = "crates/apiplant-function", version = "0.8.1" }
apiplant-core = { path = "crates/apiplant-core", version = "0.8.1" }
apiplant-db = { path = "crates/apiplant-db", version = "0.8.1" }
apiplant-auth = { path = "crates/apiplant-auth", version = "0.8.1" }
apiplant-email = { path = "crates/apiplant-email", version = "0.8.1" }
apiplant-cache = { path = "crates/apiplant-cache", version = "0.8.1" }
apiplant-storage = { path = "crates/apiplant-storage", version = "0.8.1" }
apiplant-queue = { path = "crates/apiplant-queue", version = "0.8.1" }
apiplant-payments = { path = "crates/apiplant-payments", version = "0.8.1" }
apiplant-oauth = { path = "crates/apiplant-oauth", version = "0.8.1" }
apiplant-ai = { path = "crates/apiplant-ai", version = "0.8.1" }
apiplant-js = { path = "crates/apiplant-js", version = "0.8.1" }
apiplant-server = { path = "crates/apiplant-server", version = "0.8.1" }

# Stable ABI for dynamically loaded functions
abi_stable = "0.11"

# Async runtime + web server
# `full` is not our choice to trim: deno_core enables it, and cargo unifies
# features across the graph, so narrowing this list changes nothing.
tokio = { version = "1", features = ["full"] }
ntex = { version = "2", features = ["tokio", "rustls"] }
# Token buckets for `[rate_limit]`. Pinned to the 0.2 line, which is the one
# built against ntex 2 — 0.3 tracks ntex 3, and taking it would compile a
# second copy of the whole web stack for a bucket of tokens. The middleware
# that selects a bucket per route is ours (`apiplant-server::rate_limit`), and
# so is the client-address lookup: the peer socket unless the deployment says
# a proxy in front of it writes `X-Forwarded-For`.
ntex-ratelimiter = { version = "0.2", default-features = false, features = ["tokio"] }

# Database (sea-query for dynamic schema/queries, sea-orm for the pool + executor)
sea-orm = { version = "1.1", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "with-uuid",
    "with-chrono",
    "with-json",
    "macros",
] }
sea-query = { version = "0.32", features = ["backend-postgres", "with-uuid", "with-chrono", "with-json"] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
toml = "0.8"

# Auth
argon2 = "0.5"
jsonwebtoken = "9"

# Outbound email (HTTP APIs + SMTP) — rustls everywhere, no OpenSSL
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "charset",
    "http2",
    # `stream` is what makes a token-by-token AI reply possible: without it the
    # body is only readable once it has finished arriving, which for a chat
    # completion is the whole answer at once.
    "stream",
] }
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
    "ring",
    "webpki-roots",
] }

# AWS SigV4 request signing (SES)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Streams (SSE in, SSE out)
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Cache
redis ={ version = "0.27", default-features = false, features = [
    "tokio-rustls-comp",
    "connection-manager",
] }

# Payments (Stripe). `webpki` roots rather than the platform store, to match
# the rest of the graph: rustls everywhere, no OpenSSL, nothing read from /etc.
# Stripe, split into the resource crates this app actually touches.
#
# Pinned to the 1.0 line because it targets a *current* API version. The 0.x
# line generates against 2023-10-16, and an app whose requests speak one API
# version while its webhooks arrive in another has two shapes of every object
# to reason about — which is exactly the mismatch that used to make every
# subscription event unparseable.
#
# No `webhook-events` feature: deliveries are read as JSON (see
# `apiplant-payments/src/webhook.rs`), which is what lets an account on a newer
# version than this pin keep working.
async-stripe = { version = "1.0.0-rc.8", default-features = false, features = [
    "rustls-ring",
    "rustls-tls-webpki-roots",
] }
#
# Each resource crate is feature-gated per API object, so only the handful this
# framework touches is compiled — the alternative (`full`) generates the whole
# Stripe surface and costs minutes of build time for types nothing calls.
async-stripe-core = { version = "1.0.0-rc.8", default-features = false, features = [
    "customer",
] }
async-stripe-product = { version = "1.0.0-rc.8", default-features = false, features = [
    "product",
    "price",
] }
async-stripe-checkout = { version = "1.0.0-rc.8", default-features = false, features = [
    "checkout_session",
] }
async-stripe-billing = { version = "1.0.0-rc.8", default-features = false, features = [
    "subscription",
    "billing_portal_session",
] }
async-stripe-shared = { version = "1.0.0-rc.8", default-features = false }
async-stripe-types = { version = "1.0.0-rc.8", default-features = false }

# TLS
rustls = "0.23"
rustls-pemfile = "2"

# Terminal user interface (the `apiplant cli` console)
ratatui = "0.29"
crossterm = "0.28"

# Utilities
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Observability. OTLP over HTTP rather than gRPC: `grpc-tonic` would link tonic
# and a second RPC stack to send the same protobufs to the same collector, and
# every collector and vendor accepts OTLP/HTTP on `:4318`.
#
# The blocking reqwest client is deliberate, and it is what upstream pairs with
# the batch processor: exports happen on the SDK's own background thread, which
# has no reactor of its own, so an async client there is a runtime-lookup
# problem waiting to happen. Nothing on a request path touches it. `webpki`
# roots for the same reason as the rest of the graph — nothing read from /etc.
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "metrics",
    "http-proto",
    "http-json",
    "reqwest-blocking-client",
] }
# The exporter's HTTP client. It is `reqwest` 0.13 while the rest of the graph
# is on 0.12, so this is a second copy rather than the one we already build —
# unavoidable until the ecosystem converges, and named here only to choose its
# TLS backend. `opentelemetry-otlp`'s own `reqwest-rustls*` features are not
# usable: one is broken against 0.13's renamed features, and 0.13's `rustls`
# means aws-lc-rs, which is a C toolchain in a build that otherwise needs none.
# `rustls-no-provider` takes the process-default provider instead, and
# `telemetry::init` installs ring — the same provider the TLS listener uses.
otlp-http-client = { package = "reqwest", version = "0.13", default-features = false, features = [
    "blocking",
    "rustls-no-provider",
    "http2",
    "charset",
] }
opentelemetry-semantic-conventions = { version = "0.32", features = ["semconv_experimental"] }
tracing-opentelemetry = "0.33"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
libloading = "0.8"

# TypeScript/JavaScript functions: V8 isolates at runtime, oxc to strip types at build time
# `include_icu_data` hands V8 the full ICU tables at startup. Without it the
# engine still *has* `Intl`, but every locale collapses to a root fallback:
# `toLocaleString("de-DE")` formats like English and currencies lose their
# symbols. It is the difference between an `Intl` that exists and one that is
# correct, and it costs binary size rather than runtime.
deno_core = { version = "0.409", features = ["include_icu_data"] }
deno_error = "0.7"
# The Web platform globals (encoding, URL, timers, streams, Blob). Pinned to the
# versions built against `deno_core` 0.409 — these crates track deno_core's
# 0.x line exactly, so a bump to either is a bump to all three.
deno_web = "0.287"
deno_webidl = "0.256"
oxc_allocator = "0.141"
oxc_ast = "0.141"
oxc_codegen = "0.141"
oxc_parser = "0.141"
oxc_semantic = "0.141"
oxc_span = "0.141"
oxc_transformer = "0.141"
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
# Cross-crate inlining across the whole graph, in one codegen unit so LLVM sees
# everything at once. Slow to build, but this is the profile we ship.
lto = "fat"
codegen-units = 1
# Debug symbols are ~20MB of a binary nobody debugs from a release build.
strip = "symbols"
incremental = false
panic = "unwind"

# Functions are loaded as cdylibs over a C ABI, so they must be built with the
# same settings — a `panic = "abort"` here would abort on a unwind that crosses
# back from V8 or from a plugin.

[profile.release.package."*"]
opt-level = 3
codegen-units = 1
