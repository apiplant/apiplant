name: release

# Tag a version to cut a release:
#
#   git tag v0.x.0 && git push origin v0.x.0
#
# That builds the `apiplant` binary for every supported platform, publishes a
# multi-arch image to ghcr.io/apiplant/apiplant, and attaches the archives and
# their checksums to the GitHub release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (dry run: no release is published)"
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A release build is LTO + one codegen unit; the extra debug info earlier
  # stages emit is stripped anyway.
  CARGO_INCREMENTAL: 0

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Uncomment together with the signing steps below. Job level, not step
    # level, so those steps can test for it in their `if:` — a secret cannot be
    # read from an expression directly.
    # env:
    #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --bin apiplant --target ${{ matrix.target }}

      # The macOS binaries ship unsigned until there is a Developer ID
      # certificate to sign them with. Enrolling in the Apple Developer Program
      # is the only thing missing: uncomment the two steps below and the
      # `APPLE_CERTIFICATE` job env above, then set the six repository secrets
      # they read. Both steps are already guarded on the certificate secret
      # being present, so a fork without it still builds a full set of
      # archives.
      #
      # `--options runtime` (the hardened runtime) is what notarisation
      # requires, and `--timestamp` is what keeps the signature valid after the
      # certificate expires. Watch the first signed run: V8 JITs, so if
      # notarisation is rejected for it, the fix is an entitlements plist with
      # `com.apple.security.cs.allow-jit` passed via `--entitlements`.
      #
      # Notarisation is submitted as a zip because `notarytool` reads zip, dmg
      # and pkg only. A bare executable has nowhere to staple a ticket to, so
      # none is stapled: Gatekeeper looks the binary up online instead. That
      # only matters for a binary that arrives quarantined (a browser
      # download) — one fetched with curl never is.
      #
      # - name: Import Developer ID certificate
      #   if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
      #   uses: apple-actions/import-codesign-certs@v3
      #   with:
      #     p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
      #     p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #
      # - name: Sign and notarise
      #   if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
      #   env:
      #     IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #     PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      #   run: |
      #     binary="target/${{ matrix.target }}/release/apiplant"
      #     codesign --force --sign "$IDENTITY" --options runtime --timestamp "$binary"
      #     codesign --verify --strict --verbose=2 "$binary"
      #
      #     ditto -c -k "$binary" notarize.zip
      #     xcrun notarytool submit notarize.zip \
      #       --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD" \
      #       --wait --timeout 30m
      #     rm notarize.zip

      # One archive per target, named after it, holding the binary and the
      # README — enough to unpack anywhere and run.
      - name: Package
        shell: bash
        run: |
          name="apiplant-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/apiplant" "$name/"
          cp README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            apiplant-*.tar.gz
            apiplant-*.tar.gz.sha256
          if-no-files-found: error

  # Each architecture is built on a runner of that architecture: emulating the
  # other one under QEMU turns a long V8 link into an unusable one.
  image:
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-22.04
          - platform: linux/arm64
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only; the tags are attached to the manifest list below,
      # once both architectures exist.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: image manifest
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      # `imagetools create` fails outright with no `-t`, so a tag list that came
      # back empty is a workflow bug rather than something to push past.
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          tags=$(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ -z "$tags" ]; then
            echo "::error::docker/metadata-action produced no tags for ${GITHUB_REF}" >&2
            exit 1
          fi

          args=()
          for tag in $tags; do args+=(-t "$tag"); done

          docker buildx imagetools create "${args[@]}" \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

  # Repackaging, not building: both .debs are assembled on one runner from the
  # archives the `binaries` job produced, because putting an already-built
  # binary into an ar archive is architecture-independent work.
  debian:
    name: debian packages
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p debs

          build() { # <debian arch> <rust target>
            local arch="$1" triple="$2" root="stage/$arch"

            tar xzf "dist/apiplant-${GITHUB_REF_NAME}-$triple.tar.gz"
            local src="apiplant-${GITHUB_REF_NAME}-$triple"

            install -Dm755 "$src/apiplant" "$root/usr/bin/apiplant"
            install -Dm644 "$src/README.md" "$root/usr/share/doc/apiplant/README.md"

            # dpkg reports installed size in KiB, and dpkg-deb does not work it
            # out on its own — a missing or wrong value is what makes `apt`
            # mis-report what an install will cost.
            local size
            size=$(du -ks "$root/usr" | cut -f1)

            install -d "$root/DEBIAN"
            sed -e "s/@VERSION@/$version/" \
                -e "s/@ARCH@/$arch/" \
                -e "s/@INSTALLED_SIZE@/$size/" \
                packaging/debian/control > "$root/DEBIAN/control"

            if grep -qE '@[A-Z_]+@' "$root/DEBIAN/control"; then
              echo "::error::unsubstituted placeholder in the control file" >&2
              exit 1
            fi

            # Everything ships as root:root regardless of who the runner is.
            dpkg-deb --root-owner-group --build "$root" \
              "debs/apiplant_${version}-1_${arch}.deb"
          }

          build amd64 x86_64-unknown-linux-gnu
          build arm64 aarch64-unknown-linux-gnu

          cd debs
          for deb in *.deb; do shasum -a 256 "$deb" > "$deb.sha256"; done

      # A package that installs but declares the wrong architecture, or that
      # quietly lost the binary, is worth catching before it is a release asset.
      - name: Check
        run: |
          version="${GITHUB_REF_NAME#v}"
          dpkg-deb --info "debs/apiplant_${version}-1_amd64.deb"
          dpkg-deb --contents "debs/apiplant_${version}-1_amd64.deb" | grep -q './usr/bin/apiplant'
          [ "$(dpkg-deb --field "debs/apiplant_${version}-1_arm64.deb" Architecture)" = arm64 ]

          # The runner is amd64, so only that one can actually be installed and
          # run — which is the check that matters: `version` proves the binary
          # survived the round trip.
          sudo dpkg -i "debs/apiplant_${version}-1_amd64.deb"
          [ "$(apiplant version)" = "apiplant $version" ]
          sudo dpkg -r apiplant

      - uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: |
            debs/*.deb
            debs/*.deb.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: [binaries, manifest, debian]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: debian-packages

      # The image tags come from `{{version}}`, which drops the leading `v`;
      # the archive names keep the tag verbatim.
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Container image

            ```
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            docker run --rm -p 8080:8080 -v "$PWD:/app" ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```

            ## Binaries

            | platform | archive |
            | --- | --- |
            | Linux x86_64 | `apiplant-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz` |
            | Linux aarch64 | `apiplant-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz` |
            | macOS Apple silicon | `apiplant-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz` |

            ## Debian packages

            ```
            sudo dpkg -i apiplant_${{ steps.version.outputs.version }}-1_amd64.deb
            ```

            | platform | package |
            | --- | --- |
            | Debian/Ubuntu amd64 | `apiplant_${{ steps.version.outputs.version }}-1_amd64.deb` |
            | Debian/Ubuntu arm64 | `apiplant_${{ steps.version.outputs.version }}-1_arm64.deb` |

            They declare no dependencies and need glibc 2.35 — Debian 12
            (bookworm) or newer, Ubuntu 22.04 or newer.

            Each archive and package has a matching `.sha256` file. The macOS binaries are
            not yet signed — if you download one through a browser rather than
            with `curl`, clear the quarantine flag before running it:
            `xattr -d com.apple.quarantine ./apiplant`.

  # The Homebrew formula, the AUR PKGBUILD and the pacman packages all point at
  # the release archives by URL, so they can only be published once the
  # release exists — hence `needs: release` rather than running alongside it.
  # Each publish job is guarded on its credential: a fork, or this repository
  # before the secrets are set, skips it instead of failing the run.
  homebrew:
    name: homebrew tap
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Render the formula
        if: env.TAP_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha() { shasum -a 256 "dist/apiplant-${GITHUB_REF_NAME}-$1.tar.gz" | cut -d' ' -f1; }

          sed \
            -e "s/@VERSION@/$version/g" \
            -e "s/@SHA_LINUX_X86_64@/$(sha x86_64-unknown-linux-gnu)/" \
            -e "s/@SHA_LINUX_ARM64@/$(sha aarch64-unknown-linux-gnu)/" \
            -e "s/@SHA_DARWIN_ARM64@/$(sha aarch64-apple-darwin)/" \
            packaging/homebrew/apiplant.rb > /tmp/apiplant.rb

          # A leftover placeholder means an archive was missing and `sha`
          # returned nothing — publishing that formula would break `brew
          # install` for everyone on that platform.
          if grep -qE '@[A-Z_]+@' /tmp/apiplant.rb; then
            echo "::error::unsubstituted placeholder in the formula" >&2
            grep -nE '@[A-Z_]+@' /tmp/apiplant.rb >&2
            exit 1
          fi

      - name: Push to apiplant/homebrew-tap
        if: env.TAP_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/apiplant/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp /tmp/apiplant.rb tap/Formula/apiplant.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/apiplant.rb
          # Re-running a release for the same tag is a no-op rather than an error.
          git diff --cached --quiet && exit 0
          git commit -m "apiplant $version"
          git push

  # Arch packaging has two outputs from the same PKGBUILD: the AUR metadata,
  # and a pacman repository of built packages. The packages themselves need one
  # native build per architecture so the archive metadata matches the target.
  pacman-packages:
    name: pacman package (${{ matrix.arch }})
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
          - arch: aarch64
            os: ubuntu-22.04-arm
    steps:
      - name: Install the packaging tools
        run: pacman -Sy --noconfirm --needed ca-certificates

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Render the PKGBUILD
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha() { sha256sum "dist/apiplant-${GITHUB_REF_NAME}-$1.tar.gz" | cut -d' ' -f1; }

          mkdir -p /tmp/pkg
          sed \
            -e "s/@VERSION@/$version/g" \
            -e "s/@SHA_LINUX_X86_64@/$(sha x86_64-unknown-linux-gnu)/" \
            -e "s/@SHA_LINUX_ARM64@/$(sha aarch64-unknown-linux-gnu)/" \
            packaging/aur/PKGBUILD > /tmp/pkg/PKGBUILD

          if grep -qE '@[A-Z_]+@' /tmp/pkg/PKGBUILD; then
            echo "::error::unsubstituted placeholder in the PKGBUILD" >&2
            grep -nE '@[A-Z_]+@' /tmp/pkg/PKGBUILD >&2
            exit 1
          fi

      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder /tmp/pkg
          su builder -c 'cd /tmp/pkg && makepkg --cleanbuild --clean --force --nodeps'

          pkg=$(echo /tmp/pkg/*.pkg.tar.zst)
          case "$pkg" in
            *"-${{ matrix.arch }}.pkg.tar.zst") ;;
            *)
              echo "::error::package archive does not match ${{ matrix.arch }}: $pkg" >&2
              exit 1
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: pacman-package-${{ matrix.arch }}
          path: /tmp/pkg/*.pkg.tar.zst
          if-no-files-found: error

  # The apt repository is cumulative: the whole pool is cloned, the new
  # packages are added to it, and every index is regenerated over the result.
  # Regenerating from only the new .debs would publish a Packages file that
  # drops every earlier version, which is how `apt install apiplant=0.5.0`
  # stops working.
  apt:
    name: apt repository
    needs: [debian, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # dpkg-scanpackages and apt-ftparchive are Debian's own tools; the runner
    # has apt but not dpkg-dev, and a container is cheaper than installing it.
    container: debian:bookworm
    env:
      APT_REPO_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
    steps:
      - name: Install the archive tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg git ca-certificates

      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/download-artifact@v4
        with:
          path: debs
          name: debian-packages

      - name: Import the signing key
        if: env.APT_REPO_TOKEN != ''
        env:
          GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_KEY" ]; then
            echo "::error::APT_REPO_TOKEN is set but APT_GPG_PRIVATE_KEY is not" >&2
            exit 1
          fi
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          # The key id is needed explicitly: a CI keyring with one secret key
          # still has no default, and an unsigned Release is one apt refuses.
          gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec:/ { print $5; exit }' > /tmp/keyid
          test -s /tmp/keyid

      - name: Add the packages to the pool
        if: env.APT_REPO_TOKEN != ''
        run: |
          git clone --depth 1 \
            "https://x-access-token:${APT_REPO_TOKEN}@github.com/apiplant/apt.git" repo

          # `pool/main/a/apiplant/` is the layout apt expects: component, then
          # the first letter of the source package, then the package.
          mkdir -p repo/pool/main/a/apiplant
          cp debs/*.deb repo/pool/main/a/apiplant/

          # GitHub Pages stops publishing at 1GB, and every release adds two
          # ~22MB packages to a pool that is never pruned. Said out loud well
          # before it is reached, because the fix — dropping old versions, or
          # moving the pool off Pages — is not one to discover at the limit.
          size=$(du -sm repo/pool | cut -f1)
          if [ "$size" -gt 700 ]; then
            echo "::warning::the apt pool is ${size}MB; GitHub Pages stops at 1GB." \
                 "Prune old versions from apiplant/apt or move the pool elsewhere."
          fi

      - name: Generate the indices
        if: env.APT_REPO_TOKEN != ''
        working-directory: repo
        run: |
          for arch in amd64 arm64; do
            dir="dists/stable/main/binary-$arch"
            mkdir -p "$dir"
            # /dev/null as the override file: there is no Debian override
            # database here, and dpkg-scanpackages insists on the argument.
            dpkg-scanpackages --arch "$arch" pool /dev/null > "$dir/Packages"
            gzip -9kf "$dir/Packages"
            test -s "$dir/Packages"
          done

          # Written outside the tree and moved in: apt-ftparchive checksums
          # every file under dists/stable, and a Release file it is midway
          # through writing is one of them.
          apt-ftparchive -c ../source/packaging/apt/apt-ftparchive.conf \
            release dists/stable > /tmp/Release
          mv /tmp/Release dists/stable/Release

      - name: Sign and publish
        if: env.APT_REPO_TOKEN != ''
        working-directory: repo
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          keyid=$(cat /tmp/keyid)

          # A passphrase-less key needs no --passphrase, and passing an empty
          # one to gpg is an error rather than a no-op. Held in the positional
          # parameters rather than an array: this job runs in a container, where
          # the step shell is plain sh and `pass=()` is a syntax error.
          set --
          if [ -n "$GPG_PASSPHRASE" ]; then
            set -- --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE"
          fi

          # Both signatures: InRelease is what apt fetches, Release.gpg is what
          # older clients and mirroring tools still look for.
          gpg --batch --yes "$@" --local-user "$keyid" \
            --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes "$@" --local-user "$keyid" \
            --detach-sign --armor -o dists/stable/Release.gpg dists/stable/Release

          # The keyring users install, dearmored so it can be dropped into
          # /usr/share/keyrings and named by `signed-by` as-is.
          gpg --export "$keyid" > apiplant-archive-keyring.gpg

          # GitHub Pages runs Jekyll otherwise, which would rewrite parts of a
          # tree that has to be served byte-for-byte.
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "apiplant $version"
          git push

  # The pacman repository is cumulative too, but its database only references
  # the newest build of each package name. New package files are copied into
  # the architecture directory, signed, and added to the repository database.
  pacman:
    name: pacman repository
    needs: [release, pacman-packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      PACMAN_REPO_TOKEN: ${{ secrets.PACMAN_REPO_TOKEN }}
    steps:
      - name: Install the archive tools
        run: pacman -Sy --noconfirm --needed git gnupg ca-certificates

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pacman-package-*
          merge-multiple: false

      - name: Import the signing key
        if: env.PACMAN_REPO_TOKEN != ''
        env:
          GPG_KEY: ${{ secrets.PACMAN_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_KEY" ]; then
            echo "::error::PACMAN_REPO_TOKEN is set but PACMAN_GPG_PRIVATE_KEY is not" >&2
            exit 1
          fi
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec:/ { print $5; exit }' > /tmp/keyid
          test -s /tmp/keyid

      - name: Add the packages to the pool
        if: env.PACMAN_REPO_TOKEN != ''
        run: |
          git clone --depth 1 \
            "https://x-access-token:${PACMAN_REPO_TOKEN}@github.com/apiplant/pacman.git" repo

          mkdir -p repo/x86_64 repo/aarch64
          cp dist/pacman-package-x86_64/*.pkg.tar.zst repo/x86_64/
          cp dist/pacman-package-aarch64/*.pkg.tar.zst repo/aarch64/

      - name: Sign, index and publish
        if: env.PACMAN_REPO_TOKEN != ''
        working-directory: repo
        env:
          GPG_PASSPHRASE: ${{ secrets.PACMAN_GPG_PASSPHRASE }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          keyid=$(cat /tmp/keyid)

          set --
          if [ -n "$GPG_PASSPHRASE" ]; then
            set -- --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE"
          fi

          sign() {
            rm -f "$1.sig"
            if [ -n "$GPG_PASSPHRASE" ]; then
              gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --local-user "$keyid" --detach-sign "$1"
            else
              gpg --batch --yes --local-user "$keyid" --detach-sign "$1"
            fi
          }

          for arch in x86_64 aarch64; do
            pkgs=$(printf '%s\n' "$PWD/$arch"/*.pkg.tar.zst)
            for pkg in $pkgs; do
              sign "$pkg"
            done

            repo-add --include-sigs "$arch/apiplant.db.tar.zst" $pkgs
            sign "$arch/apiplant.db"
            sign "$arch/apiplant.files"
          done

          gpg --armor --export "$keyid" > apiplant.gpg
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "apiplant $version"
          git push

  # AUR publishing is paused for now: the AUR is rejecting package updates
  # while under attack. Keep packaging/aur/PKGBUILD in-tree because the pacman
  # packaging flow consumes the same manifest, but do not push to the AUR.
  # aur:
  #   ...
