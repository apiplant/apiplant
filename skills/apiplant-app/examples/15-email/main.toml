# apiplant demo app configuration. Every key here is optional; delete the file
# entirely and the framework still boots with safe defaults.

[app]
name = "15 · Email"

[server]
port = 8099
base_path = "/api"          # the API is mounted under /api

[database]
# Any string in any of an app's TOML files may reference the environment:
# `$VAR`, `${VAR}`, or `${VAR:-default}` as here — so this line works
# unchanged locally and against a managed database in production.
url = "${DATABASE_URL:-postgres://postgres@127.0.0.1:5432/apiplant_email}"
auto_migrate = true

[auth]
jwt_secret = "demo-secret-change-me-in-production"
allow_registration = true   # the welcome mail hangs off /auth/register

# Confirming an address is the end of the sign-up detour, and the place to land
# afterwards is the app — not the dashboard screen that happened to spend the
# token. `POST /auth/verify-email` returns this as `redirect_to` beside the
# session token, and the dashboard sends the browser there.
#
# An absolute URL or a path on this origin (`/welcome`). Unset, the key is
# absent from the response rather than empty, so a client can tell "go here"
# from "nowhere in particular".
#
# Here it is a page in `public/`, served at the root of this origin: a
# confirmation link is opened from a mailbox, by somebody who may be signed
# into nothing, so the page it lands on has to be one anybody can fetch.
verify_email_redirect = "/thank-you.html"

# Address confirmation itself is already on: it follows `[email]`, so
# configuring a provider switches it on. `require_email_verification = false`
# here would turn it back off.

[docs]
enabled = true
path = "/docs"
title = "15 · Email"

# ---------------------------------------------------------------------------
# The whole point of this example. Naming a provider here is all it takes for
# `ctx.send_email(...)` to work inside a function — the code below never
# mentions SMTP, SendGrid or SES.
#
# It ships pointed at a local catcher (MailHog, Mailpit, `python3 -m aiosmtpd`)
# so the example runs without an account anywhere. Swap the three lines under
# `provider` for one of the blocks further down to send for real.
# ---------------------------------------------------------------------------
  [email]
  provider = "brevo"
  from     = "info@${EMAIL_DOMAIN}"
  api_key  = "${BREVO_API_KEY}"
# [email]
# provider  = "smtp"
# from      = "no-reply@example.com"
# from_name = "Example"
# reply_to  = "help@example.com"

# [email.smtp]
# host       = "127.0.0.1"
# port       = 1025
# encryption = "none"         # a catcher on localhost; never do this over a network

# SendGrid — one key, nothing else:
#   [email]
#   provider = "sendgrid"
#   from     = "no-reply@example.com"
#   api_key  = "${SENDGRID_API_KEY}"
#
# Brevo (formerly Sendinblue), Postmark and Resend look identical apart from
# the provider name.
#
# Mailjet needs both halves of its credential:
#   [email]
#   provider   = "mailjet"
#   from       = "no-reply@example.com"
#   api_key    = "${MAILJET_API_KEY}"
#   api_secret = "${MAILJET_SECRET_KEY}"
#
# Amazon SES needs a region as well:
#   [email]
#   provider   = "ses"
#   from       = "no-reply@example.com"
#   api_key    = "${AWS_ACCESS_KEY_ID}"
#   api_secret = "${AWS_SECRET_ACCESS_KEY}"
#   region     = "eu-west-1"
#
# Mailgun needs its sending domain:
#   [email]
#   provider = "mailgun"
#   from     = "no-reply@example.com"
#   api_key  = "${MAILGUN_API_KEY}"
#   domain   = "mg.example.com"
