# A small resource for the functions to query. Nothing special here — see
# example 02 for the resource itself.

[resource]
name = "note"
scope = "global"

[permissions]
list   = "public"
read   = "public"
create = "public"
update = "public"
delete = "public"

[fields.title]
type     = "string"
required = true

[fields.body]
type = "text"
