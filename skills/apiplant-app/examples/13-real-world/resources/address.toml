[resource]
name = "address"

[permissions]
list = "member"
read = "member"
create = "member"
update = "member"
delete = "member"

[admin]
plural = "Addresses"
group = "Sales"
order = 6
columns = ["label", "city", "country_id"]

[fields.customer_id]
type = "reference"
references = "customer"
required = true
on_delete = "cascade"

[fields.label]
type = "string"

[fields.line1]
type = "string"
required = true

[fields.line2]
type = "string"

[fields.city]
type = "string"
required = true

[fields.postal_code]
type = "string"

[fields.country_id]
type = "reference"
references = "country"
required = true
on_delete = "restrict"
