[resource]
name = "product"

[permissions]
list = "member"
read = "member"
update = "role:manager"
delete = "role:admin"

[permissions.create]
own = "role:manager"

[admin]
group = "Catalogue"
order = 1
columns = ["name", "status", "category_id"]

[fields.name]
type = "string"
required = true

[fields.slug]
type = "string"
required = true

[fields.description]
type = "text"

[fields.description.admin]
format = "markdown"

[fields.category_id]
type = "reference"
references = "product_category"
required = true
on_delete = "restrict"

[fields.status]
type = "string"
default = "draft"

[fields.attributes]
type = "json"
